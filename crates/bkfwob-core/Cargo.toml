[package]
name = "bkfwob-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Broker-neutral order types, guardrails, journal and reconciliation for the bkfwob toolchain"
keywords = ["broker", "trading", "orders", "finance", "fwob"]
categories = ["finance"]

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
