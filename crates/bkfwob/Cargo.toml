[package]
name = "bkfwob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Broker integration layer for the fwob toolchain: accounts, orders and guardrails over a CLI and MCP"
keywords = ["broker", "trading", "ibkr", "finance", "fwob"]
categories = ["command-line-utilities", "finance"]

[features]
default = ["ibkr", "mcp"]
# Interactive Brokers through IB Gateway or TWS.
ibkr = ["dep:ibapi"]
# `bkfwob mcp`: the account and the guardrailed order path over the Model Context Protocol.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
bkfwob-core = { version = "0.1.0", path = "../bkfwob-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ibapi = { version = "4.0", optional = true, default-features = false, features = ["sync"] }
jiff = "0.2"
# Same range and features as mdfwob, whose CI guards rmcp's MSRV at this workspace's floor.
rmcp = { version = "3.1", optional = true, default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
schemars = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"
