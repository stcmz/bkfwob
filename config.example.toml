# bkfwob configuration. Copy to ~/.bkfwob/config.toml (or pass the path as the first argument).
# Every key is optional; a misspelled key is an error rather than a silent default.

[broker]
kind = "ibkr"   # ibkr | fake
mode = "paper"  # paper | live. Live also requires BKFWOB_LIVE=1 in the environment, and the
                # account the broker reports must actually be live (IB paper accounts are DU...).

[ibkr]
host = "127.0.0.1"
# port = 4002   # default by mode: Gateway 4002 paper / 4001 live (TWS: 7497 / 7496)
client_id = 17  # keep stable: IB only lets the placing client id modify or cancel an order
# account = "DU1234567"  # needed when the login has several accounts
timeout_secs = 10

[fake]
cash = 100000.0

[limits]
max_order_notional = 5000.0
max_daily_notional = 25000.0
max_position_value = 10000.0
max_open_orders = 20
orders_per_minute = 10
collar_pct = 5.0          # refuse a limit price more than 5% through the market; 0 disables
quote_max_age_secs = 60   # market orders need a quote at most this old
allow_short = false       # a sell may not exceed the position (counting working sells)
symbols = []              # non-empty: only these may be traded
deny = []

[mcp]
allow_live = false        # `bkfwob mcp` refuses to start against a live account unless true

# [state]
# dir = "C:/Users/me/.bkfwob"   # default: BKFWOB_STATE or ~/.bkfwob
